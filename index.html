<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<meta name="color-scheme" content="dark">
<title>Galery Tika — WebP Gallery</title>

<!--
  GITHUB PAGES VERSION
  ------------------------------------------------------------
  1. Simpan file ini sebagai index.html
  2. Taruh semua .webp di folder yang sama
  3. Upload ke GitHub Pages
  4. Tidak membutuhkan PHP.

  Agar daftar WebP terbaca otomatis, aplikasi memakai GitHub
  Contents API. Jika repository private, API tidak dapat dipakai
  tanpa autentikasi; gunakan repository PUBLIC untuk GitHub Pages.
-->

<!-- Prioritas gambar pertama: script akan menentukan URL-nya secepat mungkin -->
<link rel="preconnect" href="https://api.github.com" crossorigin>

<style>
:root{
  --bg:#06080c;
  --panel:rgba(11,16,23,.68);
  --panel-strong:rgba(9,13,19,.88);
  --border:rgba(255,255,255,.13);
  --text:#f8fafc;
  --muted:#a5afbd;
  --accent:#00d084;
  --accent2:#54e7b0;
  --shadow:0 20px 70px rgba(0,0,0,.42);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;height:100dvh;
  overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
button{user-select:none}
#app{
  position:fixed;inset:0;overflow:hidden;background:#06080c;
}
#bg{
  position:absolute;inset:0;
  background:#06080c center/cover no-repeat;
  z-index:0;
  transition:background-image .35s ease,background-size .25s ease;
  will-change:background-image;
}
#bg.contain{background-size:contain}
#bg::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 35%,rgba(0,0,0,.02),rgba(0,0,0,.30) 75%),
    linear-gradient(180deg,rgba(3,5,8,.78) 0%,rgba(3,5,8,.08) 28%,rgba(3,5,8,.08) 62%,rgba(3,5,8,.86) 100%);
  pointer-events:none;
}
.topbar,.bottombar{
  position:absolute;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--panel);
  border-color:var(--border);
  backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
}
.topbar{
  top:0;padding:13px max(14px,env(safe-area-inset-left)) 13px max(14px,env(safe-area-inset-right));
  padding-left:max(14px,env(safe-area-inset-left));
  padding-right:max(14px,env(safe-area-inset-right));
  border-bottom:1px solid var(--border);
}
.bottombar{
  bottom:0;padding:13px max(14px,env(safe-area-inset-right)) calc(13px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  border-top:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent2),var(--accent));
  color:#03130c;font-weight:900;box-shadow:0 8px 30px rgba(0,208,132,.2);
}
.brand-text{min-width:0}
.brand-title{font-size:15px;font-weight:850;letter-spacing:.1px}
.brand-sub{font-size:10px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:7px;align-items:center}
.btn{
  height:39px;padding:0 12px;border:1px solid var(--border);
  border-radius:12px;background:rgba(255,255,255,.07);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  cursor:pointer;font-size:12px;font-weight:750;
  transition:.18s ease;box-shadow:0 5px 20px rgba(0,0,0,.12);
}
.btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#03130c}
.btn.icon{width:39px;padding:0;border-radius:50%}
.center-count{
  position:absolute;left:50%;transform:translateX(-50%);
  padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.09);font-size:11px;font-weight:750;color:#dce5ee;
}
.nav{
  position:absolute;z-index:7;top:50%;transform:translateY(-50%);
  width:52px;height:52px;border-radius:50%;border:1px solid var(--border);
  background:rgba(8,13,18,.52);backdrop-filter:blur(14px);
  display:grid;place-items:center;font-size:24px;cursor:pointer;
  box-shadow:var(--shadow);transition:.18s ease;
}
.nav:hover{background:var(--accent);color:#03130c;transform:translateY(-50%) scale(1.06)}
.prev{left:18px}.next{right:18px}
.info{min-width:0;max-width:62%}
.filename{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:10px;color:var(--muted);margin-top:3px}
.loading{
  position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  background:#06080c;
  transition:opacity .3s ease,visibility .3s ease;
}
.loading.hide{opacity:0;visibility:hidden;pointer-events:none}
.loading-card{
  width:min(330px,calc(100% - 40px));padding:22px;border:1px solid var(--border);
  border-radius:22px;background:rgba(12,17,24,.72);backdrop-filter:blur(20px);
  text-align:center;box-shadow:var(--shadow);
}
.spinner{
  width:34px;height:34px;margin:0 auto 12px;border-radius:50%;
  border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
.loading-title{font-size:14px;font-weight:800}
.loading-sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:absolute;z-index:30;left:50%;bottom:92px;
  transform:translate(-50%,15px);opacity:0;pointer-events:none;
  padding:10px 15px;border:1px solid var(--border);border-radius:999px;
  background:rgba(9,14,20,.9);backdrop-filter:blur(15px);
  font-size:11px;font-weight:750;white-space:nowrap;transition:.25s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{
  position:absolute;inset:0;z-index:40;display:none;flex-direction:column;
  padding:16px; padding-top:max(16px,env(safe-area-inset-top));
  background:rgba(4,7,11,.9);backdrop-filter:blur(24px);
}
.modal.show{display:flex}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 2px 14px;border-bottom:1px solid var(--border);
}
.modal-title{font-size:15px;font-weight:850}
.modal-meta{font-size:10px;color:var(--muted);margin-top:3px}
.grid{
  flex:1;overflow:auto;padding:15px 2px 8px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:11px;
  align-content:start;
}
.card{
  position:relative;aspect-ratio:1;border:2px solid transparent;
  border-radius:15px;overflow:hidden;background:#111820;cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.25);transition:.18s ease;
}
.card:hover{transform:translateY(-2px)}
.card.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(0,208,132,.2),0 12px 30px rgba(0,208,132,.14)}
.card img{width:100%;height:100%;display:block;object-fit:cover;background:#111820}
.card::after{
  content:"";position:absolute;inset:auto 0 0;height:45%;
  background:linear-gradient(transparent,rgba(0,0,0,.82));
}
.card-num{
  position:absolute;z-index:2;top:7px;left:7px;
  padding:3px 6px;border-radius:7px;background:rgba(0,0,0,.58);
  font-size:9px;font-weight:850;color:var(--accent2);
}
.card-name{
  position:absolute;z-index:2;left:8px;right:8px;bottom:7px;
  font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.empty{
  grid-column:1/-1;text-align:center;padding:50px 15px;color:var(--muted);
  font-size:12px;line-height:1.6;
}
@media(max-width:600px){
  .brand-sub{display:none}
  .btn span{display:none}
  .btn{width:39px;padding:0}
  .btn.primary{width:39px}
  .nav{width:44px;height:44px;font-size:20px}
  .prev{left:9px}.next{right:9px}
  .center-count{font-size:10px}
  .info{max-width:70%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}
}
</style>
</head>

<body>
<div id="app">
  <div id="bg"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">▶</div>
      <div class="brand-text">
        <div class="brand-title">Galery Tika</div>
        <div class="brand-sub">Premium WebP Gallery</div>
      </div>
    </div>

    <div class="center-count" id="countTop">0 / 0</div>

    <div class="actions">
      <button class="btn primary" onclick="openGallery()" title="Galeri">
        <span>Galeri</span><b>▦</b>
      </button>
      <button class="btn" onclick="document.getElementById('fileInput').click()" title="Upload WebP">
        <span>Upload</span><b>＋</b>
      </button>
      <button class="btn icon" id="fitBtn" onclick="toggleFit()" title="Cover / Contain">⛶</button>
      <button class="btn icon" id="autoBtn" onclick="toggleAuto()" title="Auto Play">↻</button>
      <input id="fileInput" type="file" accept=".webp,image/webp" multiple hidden onchange="handleUpload(event)">
    </div>
  </header>

  <button class="nav prev" onclick="prevWebp()" aria-label="Sebelumnya">‹</button>
  <button class="nav next" onclick="nextWebp()" aria-label="Selanjutnya">›</button>

  <footer class="bottombar">
    <div class="info">
      <div class="filename" id="filename">Memuat koleksi…</div>
      <div class="status" id="status">Menyiapkan WebP</div>
    </div>
    <button class="btn icon" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
  </footer>

  <div class="toast" id="toast"></div>

  <section class="modal" id="modal">
    <div class="modal-head">
      <div>
        <div class="modal-title">Koleksi WebP</div>
        <div class="modal-meta" id="modalMeta">0 file</div>
      </div>
      <button class="btn icon" onclick="closeGallery()" title="Tutup">×</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="loading" id="loading">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-title">Menyiapkan galeri</div>
      <div class="loading-sub" id="loadingSub">Mencari file WebP…</div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   KONFIGURASI GITHUB
   ============================================================
   Biarkan kosong jika index.html berada di ROOT repository.
   Jika berada di subfolder, isi FOLDER_PATH, contoh: "webp".
   ============================================================ */
const FOLDER_PATH = "";

const AUTO_DELAY = 20000;

let webpList = [];
let currentIndex = 0;
let fitContain = false;
let autoPlay = true;
let timer = null;
let deck = [];
let touchX = 0;
let touchY = 0;
let toastTimer = null;

/* ---------- GitHub info dari URL GitHub Pages ---------- */
function getRepoInfo(){
  const host = location.hostname;
  const path = location.pathname.split("/").filter(Boolean);

  // username.github.io -> repo biasanya username.github.io
  if(host.endsWith(".github.io")){
    const owner = host.split(".")[0];
    const repo = path.length ? path[0] : `${owner}.github.io`;
    return {
      owner,
      repo,
      branch: "main"
    };
  }

  // Custom domain tidak memberi tahu owner/repo.
  // Untuk custom domain, isi manual di bawah jika diperlukan.
  return null;
}

/* Jika memakai custom domain, isi tiga variabel ini. */
const MANUAL_OWNER = "";
const MANUAL_REPO = "";
const MANUAL_BRANCH = "main";

function githubConfig(){
  const auto = getRepoInfo();
  const owner = MANUAL_OWNER || (auto && auto.owner);
  const repo = MANUAL_REPO || (auto && auto.repo);
  const branch = MANUAL_BRANCH || (auto && auto.branch);

  if(!owner || !repo) return null;
  return {owner,repo,branch};
}

/* ---------- Utilitas ---------- */
function fileName(path){
  const clean = String(path).split("?")[0].split("#")[0];
  return decodeURIComponent(clean.substring(clean.lastIndexOf("/") + 1));
}
function encodedPath(path){
  return path.split("/").map(encodeURIComponent).join("/");
}
function rawUrl(item){
  return `https://raw.githubusercontent.com/${item.owner}/${item.repo}/${item.branch}/${encodedPath(item.path)}`;
}
function setLoading(show,text){
  const el=document.getElementById("loading");
  el.classList.toggle("hide",!show);
  if(text) document.getElementById("loadingSub").textContent=text;
}
function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2400);
}

/* ---------- Ambil semua WebP melalui GitHub Contents API ---------- */
async function listGithubWebp(){
  const cfg=githubConfig();
  if(!cfg) throw new Error("GitHub repository tidak dapat dikenali.");

  const path=FOLDER_PATH ? `/${FOLDER_PATH.replace(/^\/|\/$/g,"")}` : "";
  const api=`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents${path}?ref=${encodeURIComponent(cfg.branch)}`;

  const response=await fetch(api,{
    headers:{Accept:"application/vnd.github+json"},
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error(`GitHub API HTTP ${response.status}`);
  }

  const data=await response.json();
  if(!Array.isArray(data)) throw new Error("Folder GitHub tidak dapat dibaca.");

  return data
    .filter(item =>
      item.type==="file" &&
      /\.webp$/i.test(item.name)
    )
    .map(item=>({
      name:item.name,
      path:item.path,
      owner:cfg.owner,
      repo:cfg.repo,
      branch:cfg.branch,
      url:rawUrl({
        path:item.path,
        owner:cfg.owner,
        repo:cfg.repo,
        branch:cfg.branch
      })
    }))
    .sort((a,b)=>a.name.localeCompare(b.name,navigator.language,{numeric:true,sensitivity:"base"}));
}

/* ---------- Fallback: manifest.json ---------- */
async function listFromManifest(){
  const response=await fetch("manifest.json",{cache:"no-store"});
  if(!response.ok) throw new Error("manifest.json tidak tersedia.");
  const data=await response.json();

  if(!Array.isArray(data)) throw new Error("Format manifest.json tidak valid.");

  return data
    .filter(x=>typeof x==="string" && /\.webp$/i.test(x))
    .map(path=>({name:fileName(path),path,url:path}));
}

/* ---------- Gambar background pertama secepat mungkin ---------- */
function showFirst(item){
  if(!item) return;
  const bg=document.getElementById("bg");
  bg.style.backgroundImage=`url("${item.url.replace(/"/g,"%22")}")`;
  document.getElementById("filename").textContent=item.name;
  document.getElementById("status").textContent="Menampilkan gambar pertama…";
}

/* ---------- Player ---------- */
function updatePlayer(preloadNext=true){
  if(!webpList.length) return;

  const item=webpList[currentIndex];
  const bg=document.getElementById("bg");
  bg.style.backgroundImage=`url("${item.url.replace(/"/g,"%22")}")`;

  document.getElementById("filename").textContent=item.name;
  document.getElementById("status").textContent=
    `${currentIndex+1} dari ${webpList.length} WebP${autoPlay?" • Auto 20 detik":""}`;
  document.getElementById("countTop").textContent=`${currentIndex+1} / ${webpList.length}`;

  updateGridActive();

  // Preload gambar berikutnya tanpa menunggu halaman.
  if(preloadNext && webpList.length>1){
    const next=(currentIndex+1)%webpList.length;
    const img=new Image();
    img.decoding="async";
    img.src=webpList[next].url;
  }
}
function nextRandomIndex(){
  if(webpList.length<=1) return 0;

  if(deck.length===0){
    deck=Array.from({length:webpList.length},(_,i)=>i);
    for(let i=deck.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [deck[i],deck[j]]=[deck[j],deck[i]];
    }
    if(deck[deck.length-1]===currentIndex){
      [deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]];
    }
  }
  return deck.pop();
}
function startTimer(){
  stopTimer();
  if(!autoPlay || webpList.length<2) return;
  timer=setInterval(()=>{
    currentIndex=nextRandomIndex();
    updatePlayer();
  },AUTO_DELAY);
}
function stopTimer(){
  if(timer){clearInterval(timer);timer=null;}
}
function nextWebp(){
  if(!webpList.length) return;
  currentIndex=(currentIndex+1)%webpList.length;
  deck=[];
  updatePlayer();
  startTimer();
}
function prevWebp(){
  if(!webpList.length) return;
  currentIndex=(currentIndex-1+webpList.length)%webpList.length;
  deck=[];
  updatePlayer();
  startTimer();
}
function selectWebp(index){
  if(index<0 || index>=webpList.length) return;
  currentIndex=index;
  deck=[];
  updatePlayer();
  startTimer();
  closeGallery();
}

/* ---------- Mode tampilan ---------- */
function toggleFit(){
  fitContain=!fitContain;
  document.getElementById("bg").classList.toggle("contain",fitContain);
  document.getElementById("fitBtn").textContent=fitContain?"◧":"⛶";
  toast(fitContain?"Mode gambar utuh":"Mode layar penuh");
}
function toggleAuto(){
  autoPlay=!autoPlay;
  document.getElementById("autoBtn").textContent=autoPlay?"↻":"Ⅱ";
  if(autoPlay){
    startTimer();
    toast("Rotasi otomatis aktif • 20 detik");
  }else{
    stopTimer();
    toast("Rotasi otomatis dihentikan");
  }
}

/* ---------- Gallery ---------- */
function openGallery(){
  const modal=document.getElementById("modal");
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  document.getElementById("modalMeta").textContent=`${webpList.length} file WebP`;

  if(!webpList.length){
    grid.innerHTML='<div class="empty">Belum ada file WebP yang ditemukan.</div>';
  }else{
    webpList.forEach((item,index)=>{
      const card=document.createElement("div");
      card.className="card"+(index===currentIndex?" active":"");
      card.onclick=()=>selectWebp(index);

      const img=document.createElement("img");
      img.loading=index<12?"eager":"lazy";
      img.decoding="async";
      img.src=item.url;
      img.alt=item.name;

      const num=document.createElement("div");
      num.className="card-num";
      num.textContent=`#${index+1}`;

      const name=document.createElement("div");
      name.className="card-name";
      name.textContent=item.name;

      card.append(img,num,name);
      grid.appendChild(card);
    });
  }
  modal.classList.add("show");
}
function closeGallery(){
  document.getElementById("modal").classList.remove("show");
}
function updateGridActive(){
  document.querySelectorAll(".card").forEach((el,i)=>{
    el.classList.toggle("active",i===currentIndex);
  });
}

/* ---------- Upload lokal ---------- */
function handleUpload(event){
  const files=Array.from(event.target.files||[]);
  let count=0;

  files.forEach(file=>{
    if(file.type==="image/webp" || /\.webp$/i.test(file.name)){
      webpList.push({
        name:file.name,
        path:file.name,
        url:URL.createObjectURL(file),
        local:true
      });
      count++;
    }
  });

  if(count){
    currentIndex=webpList.length-count;
    deck=[];
    updatePlayer();
    startTimer();
    toast(`${count} WebP ditambahkan sementara`);
  }else{
    toast("Pilih file .webp");
  }
  event.target.value="";
}

/* ---------- Fullscreen ---------- */
async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(e){}
}

/* ---------- Swipe ---------- */
document.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    touchX=e.touches[0].clientX;
    touchY=e.touches[0].clientY;
  }
},{passive:true});

document.addEventListener("touchend",e=>{
  if(!e.changedTouches.length) return;
  const dx=e.changedTouches[0].clientX-touchX;
  const dy=e.changedTouches[0].clientY-touchY;

  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){
    if(dx<0) nextWebp();
    else prevWebp();
  }
},{passive:true});

/* ---------- Keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") nextWebp();
  if(e.key==="ArrowLeft") prevWebp();
  if(e.key==="Escape") closeGallery();
  if(e.code==="Space"){
    e.preventDefault();
    toggleAuto();
  }
});

/* ---------- Inisialisasi ---------- */
async function init(){
  setLoading(true,"Mencari file WebP…");

  try{
    // 1. GitHub API = daftar otomatis semua WebP.
    webpList=await listGithubWebp();

    if(!webpList.length){
      throw new Error("Tidak ada file WebP.");
    }

    // Tampilkan gambar pertama segera setelah URL diketahui.
    currentIndex=0;
    showFirst(webpList[0]);

    // Jangan tahan UI terlalu lama untuk gambar berikutnya.
    const first=new Image();
    first.decoding="async";
    first.onload=()=>{
      updatePlayer();
      setLoading(false);
      startTimer();
    };
    first.onerror=()=>{
      updatePlayer();
      setLoading(false);
      startTimer();
      toast("Gambar pertama gagal dimuat.");
    };
    first.src=webpList[0].url;

  }catch(apiError){
    // 2. Fallback manifest.json jika API tidak bisa digunakan.
    try{
      webpList=await listFromManifest();

      if(webpList.length){
        currentIndex=0;
        showFirst(webpList[0]);

        const first=new Image();
        first.decoding="async";
        first.onload=()=>{
          updatePlayer();
          setLoading(false);
          startTimer();
        };
        first.onerror=()=>{
          updatePlayer();
          setLoading(false);
          startTimer();
        };
        first.src=webpList[0].url;
        return;
      }
    }catch(manifestError){}

    setLoading(false);
    document.getElementById("filename").textContent="WebP belum ditemukan";
    document.getElementById("status").textContent=
      "Pastikan repository PUBLIC dan file .webp berada di folder yang dipindai.";
    toast("WebP belum ditemukan.");
  }
}

document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
