<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=3.0,user-scalable=yes">
<meta name="theme-color" content="#06080c">
<meta name="color-scheme" content="dark">
<title>Galery Tika — WebP Gallery Premium</title>

<link rel="preconnect" href="https://api.github.com" crossorigin>

<style>
:root{
  --bg:#06080c;
  --panel:rgba(12, 17, 24, 0.72);
  --panel-strong:rgba(10, 14, 20, 0.92);
  --border:rgba(255, 255, 255, 0.12);
  --border-light:rgba(255, 255, 255, 0.2);
  --text:#f8fafc;
  --muted:#94a3b8;
  --accent:#00d084;
  --accent-glow:rgba(0, 208, 132, 0.35);
  --accent2:#54e7b0;
  --shadow:0 20px 50px rgba(0,0,0,0.6);
  --radius:18px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;height:100dvh;
  overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
button{font:inherit;color:inherit;border:none;outline:none;background:none;}

#app{
  position:fixed;inset:0;overflow:hidden;background:#030508;
  display:flex;flex-direction:column;justify-content:space-between;
}

/* ---------- AMBIENT GLOW BACKGROUND ---------- */
#ambient-bg{
  position:absolute;inset:-30px;
  background-position:center;background-size:cover;
  filter:blur(50px) brightness(0.4) saturate(140%);
  opacity:0.85;
  transition:background-image 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  transform:scale(1.1);
  z-index:0;
  pointer-events:none;
}

/* ---------- MAIN IMAGE VIEWPORT ---------- */
#viewport{
  position:absolute;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:none;
}

#main-img{
  max-width:100%;max-height:100%;width:100%;height:100%;
  object-fit:cover;
  transition:opacity 0.35s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  will-change:transform, opacity;
  box-shadow:0 10px 40px rgba(0,0,0,0.8);
}
#main-img.contain{ object-fit:contain; }
#main-img.fade-out{ opacity:0.1; }

/* Overlay vignette */
#viewport::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.5) 100%),
    linear-gradient(180deg, rgba(3,5,8,0.7) 0%, transparent 20%, transparent 80%, rgba(3,5,8,0.85) 100%);
  pointer-events:none;
  transition:opacity 0.3s ease;
}

/* Auto-Hide UI Mode */
.ui-hidden .topbar,
.ui-hidden .bottombar,
.ui-hidden .nav,
.ui-hidden .thumb-strip,
.ui-hidden .progress-container{
  opacity:0 !important;
  pointer-events:none !important;
  transform:translateY(var(--hide-translate, 0)) !important;
}

/* ---------- PROGRESS BAR ---------- */
.progress-container{
  position:absolute;top:0;left:0;right:0;height:3px;
  background:rgba(255,255,255,0.08);z-index:12;
  transition:opacity 0.3s ease;
}
.progress-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg, var(--accent2), var(--accent));
  box-shadow:0 0 10px var(--accent-glow);
}
.progress-bar.animating{
  animation:progressAnim 20s linear forwards;
}
@keyframes progressAnim{
  from{width:0%;}
  to{width:100%;}
}

/* ---------- TOPBAR & BOTTOMBAR ---------- */
.topbar,.bottombar{
  position:absolute;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--panel);
  border-color:var(--border);
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  transition:transform 0.35s ease, opacity 0.35s ease;
}
.topbar{
  top:0;padding:12px max(14px,env(safe-area-inset-left)) 12px max(14px,env(safe-area-inset-right));
  padding-top:max(12px,env(safe-area-inset-top));
  border-bottom:1px solid var(--border);
  --hide-translate:-100%;
}
.bottombar{
  bottom:0;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  border-top:1px solid var(--border);
  --hide-translate:100%;
  flex-direction:column;gap:8px;
}

.bottom-info-row{
  width:100%;display:flex;align-items:center;justify-content:space-between;
}

.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.brand-mark{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent2),var(--accent));
  color:#03130c;font-weight:900;box-shadow:0 4px 20px var(--accent-glow);
}
.brand-text{min-width:0;}
.brand-title{font-size:14px;font-weight:850;letter-spacing:.2px;}
.brand-sub{font-size:10px;color:var(--muted);margin-top:1px;}

.actions{display:flex;gap:8px;align-items:center;}
.btn{
  height:38px;padding:0 12px;border:1px solid var(--border);
  border-radius:12px;background:rgba(255,255,255,0.06);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;font-size:12px;font-weight:750;
  transition:all .18s ease;box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
.btn:hover{background:rgba(255,255,255,0.14);border-color:var(--border-light);}
.btn:active{transform:scale(0.95);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#03130c;font-weight:850;}
.btn.icon{width:38px;padding:0;border-radius:50%;}

.center-count{
  position:absolute;left:50%;transform:translateX(-50%);
  padding:5px 12px;border-radius:999px;background:rgba(0,0,0,0.4);
  border:1px solid rgba(255,255,255,0.1);font-size:11px;font-weight:800;color:#e2e8f0;
  backdrop-filter:blur(10px);
}

/* ---------- NAVIGATION BUTTONS ---------- */
.nav{
  position:absolute;z-index:7;top:50%;transform:translateY(-50%);
  width:48px;height:48px;border-radius:50%;border:1px solid var(--border);
  background:rgba(10, 15, 22, 0.55);backdrop-filter:blur(16px);
  display:grid;place-items:center;font-size:22px;cursor:pointer;
  box-shadow:var(--shadow);transition:all .2s ease;
  --hide-translate:0;
}
.nav:hover{background:var(--accent);color:#03130c;transform:translateY(-50%) scale(1.08);}
.nav:active{transform:translateY(-50%) scale(0.92);}
.prev{left:16px;}.next{right:16px;}

.info{min-width:0;max-width:70%;}
.filename{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.status{font-size:10px;color:var(--muted);margin-top:2px;}

/* ---------- MINI THUMBNAIL STRIP ---------- */
.thumb-strip{
  width:100%;display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;
  scrollbar-width:none;-ms-overflow-style:none;
  transition:transform 0.35s ease, opacity 0.35s ease;
}
.thumb-strip::-webkit-scrollbar{display:none;}
.thumb-item{
  width:44px;height:44px;flex-shrink:0;border-radius:10px;
  overflow:hidden;border:2px solid transparent;opacity:0.5;
  transition:all 0.2s ease;cursor:pointer;background:#111820;
}
.thumb-item img{width:100%;height:100%;object-fit:cover;}
.thumb-item.active{
  opacity:1;border-color:var(--accent);transform:scale(1.08);
  box-shadow:0 0 12px var(--accent-glow);
}

/* ---------- LOADING & TOAST ---------- */
.loading{
  position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  background:#06080c;
  transition:opacity .3s ease,visibility .3s ease;
}
.loading.hide{opacity:0;visibility:hidden;pointer-events:none;}
.loading-card{
  width:min(320px,calc(100% - 40px));padding:24px;border:1px solid var(--border);
  border-radius:24px;background:rgba(12,17,24,0.85);backdrop-filter:blur(20px);
  text-align:center;box-shadow:var(--shadow);
}
.spinner{
  width:36px;height:36px;margin:0 auto 14px;border-radius:50%;
  border:3px solid rgba(255,255,255,0.1);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
.loading-title{font-size:15px;font-weight:850;}
.loading-sub{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{
  position:absolute;z-index:30;left:50%;bottom:120px;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:10px 18px;border:1px solid var(--border);border-radius:999px;
  background:rgba(10,15,22,0.92);backdrop-filter:blur(20px);
  font-size:11px;font-weight:800;white-space:nowrap;transition:all .25s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- BOTTOM SHEET MODAL ---------- */
.modal-overlay{
  position:absolute;inset:0;z-index:40;background:rgba(0,0,0,0.65);
  backdrop-filter:blur(12px);opacity:0;pointer-events:none;
  transition:opacity 0.3s ease;
}
.modal-overlay.show{opacity:1;pointer-events:auto;}

.bottom-sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:41;
  max-height:82vh;height:82vh;border-radius:28px 28px 0 0;
  background:var(--panel-strong);border:1px solid var(--border);border-bottom:none;
  backdrop-filter:blur(30px);
  display:flex;flex-direction:column;padding:12px 18px 20px;
  transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.bottom-sheet.show{transform:translateY(0);}

.sheet-handle-bar{
  width:40px;height:5px;border-radius:99px;background:rgba(255,255,255,0.25);
  margin:2px auto 14px;cursor:pointer;
}

.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:12px;border-bottom:1px solid var(--border);
}
.modal-title{font-size:16px;font-weight:850;}
.modal-meta{font-size:11px;color:var(--muted);margin-top:2px;}

.grid{
  flex:1;overflow-y:auto;padding:16px 2px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;
  align-content:start;scrollbar-width:thin;
}
.card{
  position:relative;aspect-ratio:1;border:2px solid transparent;
  border-radius:16px;overflow:hidden;background:#111820;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.3);transition:all .18s ease;
}
.card:active{transform:scale(0.96);}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow),0 8px 25px rgba(0,208,132,0.25);}
.card img{width:100%;height:100%;display:block;object-fit:cover;}
.card::after{
  content:"";position:absolute;inset:auto 0 0;height:50%;
  background:linear-gradient(transparent,rgba(0,0,0,0.85));
}
.card-num{
  position:absolute;z-index:2;top:6px;left:6px;
  padding:2px 6px;border-radius:6px;background:rgba(0,0,0,0.6);
  font-size:9px;font-weight:850;color:var(--accent2);backdrop-filter:blur(4px);
}
.card-name{
  position:absolute;z-index:2;left:7px;right:7px;bottom:6px;
  font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.empty{
  grid-column:1/-1;text-align:center;padding:50px 15px;color:var(--muted);
  font-size:13px;line-height:1.6;
}

@media(max-width:600px){
  .brand-sub{display:none;}
  .btn span{display:none;}
  .btn{width:38px;padding:0;}
  .btn.primary{width:38px;}
  .nav{width:42px;height:42px;font-size:18px;}
  .prev{left:10px;}.next{right:10px;}
  .center-count{font-size:10px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:8px;}
}
</style>
</head>

<body>
<div id="app">
  <!-- Ambient Blur Background -->
  <div id="ambient-bg"></div>

  <!-- Auto-Play Progress Bar -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Main Viewport -->
  <div id="viewport">
    <img id="main-img" src="" alt="WebP Display" />
  </div>

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">▶</div>
      <div class="brand-text">
        <div class="brand-title">Galery Tika</div>
        <div class="brand-sub">Premium WebP Gallery</div>
      </div>
    </div>

    <div class="center-count" id="countTop">0 / 0</div>

    <div class="actions">
      <button class="btn primary" onclick="openGallery()" title="Galeri">
        <span>Galeri</span><b>▦</b>
      </button>
      <button class="btn" onclick="document.getElementById('fileInput').click()" title="Upload WebP">
        <span>Upload</span><b>＋</b>
      </button>
      <button class="btn icon" id="fitBtn" onclick="toggleFit()" title="Cover / Contain">⛶</button>
      <button class="btn icon" id="autoBtn" onclick="toggleAuto()" title="Auto Play">↻</button>
      <input id="fileInput" type="file" accept=".webp,image/webp" multiple hidden onchange="handleUpload(event)">
    </div>
  </header>

  <!-- Navigation Buttons -->
  <button class="nav prev" onclick="prevWebp()" aria-label="Sebelumnya">‹</button>
  <button class="nav next" onclick="nextWebp()" aria-label="Selanjutnya">›</button>

  <!-- Bottombar & Thumbnail Strip -->
  <footer class="bottombar">
    <div class="thumb-strip" id="thumbStrip"></div>

    <div class="bottom-info-row">
      <div class="info">
        <div class="filename" id="filename">Memuat koleksi…</div>
        <div class="status" id="status">Menyiapkan WebP</div>
      </div>
      <button class="btn icon" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <!-- Bottom Sheet Modal Gallery -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeGallery()"></div>
  <section class="bottom-sheet" id="sheetModal">
    <div class="sheet-handle-bar" onclick="closeGallery()"></div>
    <div class="modal-head">
      <div>
        <div class="modal-title">Koleksi WebP</div>
        <div class="modal-meta" id="modalMeta">0 file</div>
      </div>
      <button class="btn icon" onclick="closeGallery()" title="Tutup">×</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Loading Screen -->
  <div class="loading" id="loading">
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-title">Menyiapkan Galeri</div>
      <div class="loading-sub" id="loadingSub">Mencari file WebP…</div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   KONFIGURASI GITHUB & APLIKASI
   ============================================================ */
const FOLDER_PATH = "";
const AUTO_DELAY = 20000; // 20 Detik

let webpList = [];
let currentIndex = 0;
let fitContain = false;
let autoPlay = true;
let timer = null;
let deck = [];
let touchX = 0;
let touchY = 0;
let lastTapTime = 0;
let isZoomed = false;
let toastTimer = null;
let isUiHidden = false;

/* ---------- GitHub Repo Auto Detect ---------- */
function getRepoInfo(){
  const host = location.hostname;
  const path = location.pathname.split("/").filter(Boolean);

  if(host.endsWith(".github.io")){
    const owner = host.split(".")[0];
    const repo = path.length ? path[0] : `${owner}.github.io`;
    return { owner, repo, branch: "main" };
  }
  return null;
}

const MANUAL_OWNER = "";
const MANUAL_REPO = "";
const MANUAL_BRANCH = "main";

function githubConfig(){
  const auto = getRepoInfo();
  const owner = MANUAL_OWNER || (auto && auto.owner);
  const repo = MANUAL_REPO || (auto && auto.repo);
  const branch = MANUAL_BRANCH || (auto && auto.branch);

  if(!owner || !repo) return null;
  return {owner,repo,branch};
}

/* ---------- Utilitas ---------- */
function haptic(){
  if("vibrate" in navigator){
    try{ navigator.vibrate(12); }catch(e){}
  }
}

function fileName(path){
  const clean = String(path).split("?")[0].split("#")[0];
  return decodeURIComponent(clean.substring(clean.lastIndexOf("/") + 1));
}
function encodedPath(path){
  return path.split("/").map(encodeURIComponent).join("/");
}
function rawUrl(item){
  return `https://raw.githubusercontent.com/${item.owner}/${item.repo}/${item.branch}/${encodedPath(item.path)}`;
}

function setLoading(show,text){
  const el=document.getElementById("loading");
  el.classList.toggle("hide",!show);
  if(text) document.getElementById("loadingSub").textContent=text;
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}

/* ---------- Fetch WebP List ---------- */
async function listGithubWebp(){
  const cfg=githubConfig();
  if(!cfg) throw new Error("GitHub repository tidak ditemukan.");

  const path=FOLDER_PATH ? `/${FOLDER_PATH.replace(/^\/|\/$/g,"")}` : "";
  const api=`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents${path}?ref=${encodeURIComponent(cfg.branch)}`;

  const response=await fetch(api,{
    headers:{Accept:"application/vnd.github+json"},
    cache:"no-store"
  });

  if(!response.ok) throw new Error(`HTTP ${response.status}`);

  const data=await response.json();
  if(!Array.isArray(data)) throw new Error("Folder tidak valid.");

  return data
    .filter(item => item.type==="file" && /\.webp$/i.test(item.name))
    .map(item=>({
      name:item.name,
      path:item.path,
      owner:cfg.owner,
      repo:cfg.repo,
      branch:cfg.branch,
      url:rawUrl({path:item.path,owner:cfg.owner,repo:cfg.repo,branch:cfg.branch})
    }))
    .sort((a,b)=>a.name.localeCompare(b.name,navigator.language,{numeric:true,sensitivity:"base"}));
}

async function listFromManifest(){
  const response=await fetch("manifest.json",{cache:"no-store"});
  if(!response.ok) throw new Error("manifest.json error.");
  const data=await response.json();
  if(!Array.isArray(data)) throw new Error("Format manifest error.");

  return data
    .filter(x=>typeof x==="string" && /\.webp$/i.test(x))
    .map(path=>({name:fileName(path),path,url:path}));
}

/* ---------- Player Logic ---------- */
function updatePlayer(preloadNext=true){
  if(!webpList.length) return;

  const item=webpList[currentIndex];
  const mainImg=document.getElementById("main-img");
  const ambientBg=document.getElementById("ambient-bg");

  // Reset Zoom saat ganti gambar
  resetZoom();

  // Cross-fade Effect
  mainImg.classList.add("fade-out");

  setTimeout(()=>{
    mainImg.src=item.url;
    ambientBg.style.backgroundImage=`url("${item.url.replace(/"/g,"%22")}")`;
    mainImg.classList.remove("fade-out");
  },150);

  document.getElementById("filename").textContent=item.name;
  document.getElementById("status").textContent=
    `${currentIndex+1} dari ${webpList.length} WebP${autoPlay?" • Auto 20s":""}`;
  document.getElementById("countTop").textContent=`${currentIndex+1} / ${webpList.length}`;

  updateGridActive();
  updateThumbActive();
  resetProgressBar();

  if(preloadNext && webpList.length>1){
    const next=(currentIndex+1)%webpList.length;
    const img=new Image();
    img.src=webpList[next].url;
  }
}

function nextRandomIndex(){
  if(webpList.length<=1) return 0;
  if(deck.length===0){
    deck=Array.from({length:webpList.length},(_,i)=>i);
    for(let i=deck.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [deck[i],deck[j]]=[deck[j],deck[i]];
    }
    if(deck[deck.length-1]===currentIndex){
      [deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]];
    }
  }
  return deck.pop();
}

function startTimer(){
  stopTimer();
  resetProgressBar();
  if(!autoPlay || webpList.length<2) return;

  const pb=document.getElementById("progressBar");
  pb.classList.add("animating");

  timer=setInterval(()=>{
    currentIndex=nextRandomIndex();
    updatePlayer();
  },AUTO_DELAY);
}

function stopTimer(){
  if(timer){clearInterval(timer);timer=null;}
  resetProgressBar();
}

function resetProgressBar(){
  const pb=document.getElementById("progressBar");
  pb.classList.remove("animating");
  void pb.offsetWidth; // Trigger reflow
  if(autoPlay && webpList.length>1){
    pb.classList.add("animating");
  }
}

function nextWebp(){
  if(!webpList.length) return;
  haptic();
  currentIndex=(currentIndex+1)%webpList.length;
  deck=[];
  updatePlayer();
  startTimer();
}

function prevWebp(){
  if(!webpList.length) return;
  haptic();
  currentIndex=(currentIndex-1+webpList.length)%webpList.length;
  deck=[];
  updatePlayer();
  startTimer();
}

function selectWebp(index){
  if(index<0 || index>=webpList.length) return;
  haptic();
  currentIndex=index;
  deck=[];
  updatePlayer();
  startTimer();
  closeGallery();
}

/* ---------- Mode Fit, Auto & UI Toggle ---------- */
function toggleFit(){
  haptic();
  fitContain=!fitContain;
  const img=document.getElementById("main-img");
  img.classList.toggle("contain",fitContain);
  document.getElementById("fitBtn").textContent=fitContain?"◧":"⛶";
  toast(fitContain?"Mode Gambar Utuh (Contain)":"Mode Layar Penuh (Cover)");
}

function toggleAuto(){
  haptic();
  autoPlay=!autoPlay;
  document.getElementById("autoBtn").textContent=autoPlay?"↻":"Ⅱ";
  if(autoPlay){
    startTimer();
    toast("Auto Play Aktif (20s)");
  }else{
    stopTimer();
    toast("Auto Play Dihentikan");
  }
}

function toggleUiVisibility(force){
  isUiHidden = (typeof force === "boolean") ? !force : !isUiHidden;
  document.getElementById("app").classList.toggle("ui-hidden", isUiHidden);
}

/* ---------- Zoom Feature ---------- */
function toggleZoom(){
  const img=document.getElementById("main-img");
  isZoomed = !isZoomed;
  if(isZoomed){
    img.style.transform="scale(2.2)";
  }else{
    resetZoom();
  }
}
function resetZoom(){
  const img=document.getElementById("main-img");
  isZoomed=false;
  img.style.transform="scale(1)";
}

/* ---------- Mini Thumbnail Strip ---------- */
function renderThumbStrip(){
  const container=document.getElementById("thumbStrip");
  container.innerHTML="";

  webpList.forEach((item,index)=>{
    const thumb=document.createElement("div");
    thumb.className="thumb-item"+(index===currentIndex?" active":"");
    thumb.onclick=()=>selectWebp(index);

    const img=document.createElement("img");
    img.src=item.url;
    img.alt=item.name;
    img.loading="lazy";

    thumb.appendChild(img);
    container.appendChild(thumb);
  });
}

function updateThumbActive(){
  const thumbs=document.querySelectorAll(".thumb-item");
  thumbs.forEach((el,i)=>{
    const isActive=i===currentIndex;
    el.classList.toggle("active",isActive);
    if(isActive){
      el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
    }
  });
}

/* ---------- Bottom Sheet Gallery ---------- */
function openGallery(){
  haptic();
  const overlay=document.getElementById("modalOverlay");
  const modal=document.getElementById("sheetModal");
  const grid=document.getElementById("grid");

  grid.innerHTML="";
  document.getElementById("modalMeta").textContent=`${webpList.length} File WebP`;

  if(!webpList.length){
    grid.innerHTML='<div class="empty">Belum ada file WebP.</div>';
  }else{
    webpList.forEach((item,index)=>{
      const card=document.createElement("div");
      card.className="card"+(index===currentIndex?" active":"");
      card.onclick=()=>selectWebp(index);

      const img=document.createElement("img");
      img.loading=index<12?"eager":"lazy";
      img.src=item.url;
      img.alt=item.name;

      const num=document.createElement("div");
      num.className="card-num";
      num.textContent=`#${index+1}`;

      const name=document.createElement("div");
      name.className="card-name";
      name.textContent=item.name;

      card.append(img,num,name);
      grid.appendChild(card);
    });
  }

  overlay.classList.add("show");
  modal.classList.add("show");
}

function closeGallery(){
  document.getElementById("modalOverlay").classList.remove("show");
  document.getElementById("sheetModal").classList.remove("show");
}

function updateGridActive(){
  document.querySelectorAll(".card").forEach((el,i)=>{
    el.classList.toggle("active",i===currentIndex);
  });
}

/* ---------- Local Upload ---------- */
function handleUpload(event){
  const files=Array.from(event.target.files||[]);
  let count=0;

  files.forEach(file=>{
    if(file.type==="image/webp" || /\.webp$/i.test(file.name)){
      webpList.push({
        name:file.name,
        path:file.name,
        url:URL.createObjectURL(file),
        local:true
      });
      count++;
    }
  });

  if(count){
    currentIndex=webpList.length-count;
    deck=[];
    renderThumbStrip();
    updatePlayer();
    startTimer();
    toast(`${count} WebP lokal ditambahkan`);
  }else{
    toast("Pilih file berkestensi .webp");
  }
  event.target.value="";
}

/* ---------- Fullscreen ---------- */
async function toggleFullscreen(){
  haptic();
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(e){}
}

/* ---------- Gesture & Touches ---------- */
const viewport = document.getElementById("viewport");

viewport.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    touchX=e.touches[0].clientX;
    touchY=e.touches[0].clientY;

    // Double Tap Detection
    const now = Date.now();
    if(now - lastTapTime < 280){
      toggleZoom();
      haptic();
    }
    lastTapTime = now;
  }
},{passive:true});

viewport.addEventListener("touchend",e=>{
  if(!e.changedTouches.length || isZoomed) return;
  const dx=e.changedTouches[0].clientX-touchX;
  const dy=e.changedTouches[0].clientY-touchY;

  // Swipe Horizontal
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){
    if(dx<0) nextWebp();
    else prevWebp();
  } 
  // Tap Single (Toggle UI)
  else if(Math.abs(dx)<8 && Math.abs(dy)<8){
    toggleUiVisibility();
  }
},{passive:true});

/* Keyboard Control */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") nextWebp();
  if(e.key==="ArrowLeft") prevWebp();
  if(e.key==="Escape") closeGallery();
  if(e.code==="Space"){
    e.preventDefault();
    toggleAuto();
  }
});

/* ---------- Initialization ---------- */
async function init(){
  setLoading(true,"Mencari file WebP…");

  try{
    webpList=await listGithubWebp();
    if(!webpList.length) throw new Error("Tidak ada file WebP.");

    currentIndex=0;
    renderThumbStrip();
    updatePlayer();
    setLoading(false);
    startTimer();

  }catch(apiError){
    try{
      webpList=await listFromManifest();
      if(webpList.length){
        currentIndex=0;
        renderThumbStrip();
        updatePlayer();
        setLoading(false);
        startTimer();
        return;
      }
    }catch(manifestError){}

    setLoading(false);
    document.getElementById("filename").textContent="WebP belum ditemukan";
    document.getElementById("status").textContent="Pastikan repo PUBLIC & file .webp tersedia.";
    toast("File WebP tidak ditemukan.");
  }
}

document.addEventListener("DOMContentLoaded",init);
</script>
