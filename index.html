<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galery Tika - WebP Player & Gallery</title>

<!-- Google Fonts & FontAwesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --bg-dark: #090d12;
  --primary: #00d285;
  --primary-hover: #00b371;
  --glass-bg: rgba(18, 26, 36, 0.75);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-card: rgba(30, 41, 59, 0.7);
  --text-main: #f1f5f9;
  --text-sub: #94a3b8;
  --accent: #38bdf8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  background-color: var(--bg-dark);
  color: var(--text-main);
  overflow: hidden;
  position: relative;
}

/* BACKGROUND FULLSCREEN PLAYER */
.bg-player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  transition: background-image 0.5s ease-in-out, background-size 0.3s ease;
}

.bg-player.fit-contain {
  background-size: contain;
}

/* OVERLAY SHADOW GRADIENT */
.overlay-gradient {
  position: absolute;
  inset: 0;
  z-index: 2;
  background: linear-gradient(180deg, rgba(9,13,18,0.65) 0%, rgba(9,13,18,0.1) 40%, rgba(9,13,18,0.1) 60%, rgba(9,13,18,0.85) 100%);
  pointer-events: none;
}

/* HEADER NAVBAR */
.app-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--glass-border);
}

.app-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.5px;
}

.app-title i {
  color: var(--primary);
  font-size: 22px;
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-tool {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--glass-border);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}

.btn-tool:hover, .btn-tool:active {
  background: var(--primary);
  color: #090d12;
  border-color: var(--primary);
  transform: translateY(-1px);
}

.btn-icon-only {
  width: 40px;
  height: 40px;
  padding: 0;
  justify-content: center;
  border-radius: 50%;
}

/* NAVIGASI PANAH SWIPE & TOUCH AREA */
.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  width: 52px;
  height: 52px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: all 0.2s ease;
  opacity: 0.75;
}

.nav-arrow:hover {
  opacity: 1;
  background: var(--primary);
  color: #090d12;
  transform: translateY(-50%) scale(1.1);
}

.nav-prev { left: 20px; }
.nav-next { right: 20px; }

/* FOOTER BAR INFORMASI & KONTROL */
.app-footer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--glass-border);
}

.info-box {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.file-name-text {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  max-width: 250px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.counter-badge {
  font-size: 12px;
  color: var(--primary);
  font-weight: 600;
}

/* MODAL DRAWER GALERI GRID */
.modal-gallery {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(9, 13, 18, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: none;
  flex-direction: column;
  padding: 20px;
  animation: fadeIn 0.25s ease-out;
}

.modal-gallery.show {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.gallery-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--glass-border);
}

.gallery-grid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px;
  padding-right: 4px;
}

.thumb-card {
  position: relative;
  aspect-ratio: 1 / 1;
  background: var(--glass-card);
  border: 2px solid transparent;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s ease;
}

.thumb-card:hover {
  transform: scale(1.03);
  border-color: var(--accent);
}

.thumb-card.active {
  border-color: var(--primary);
  box-shadow: 0 0 15px rgba(0,210,133,0.4);
}

.thumb-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.thumb-card .thumb-title {
  position: absolute;
  bottom: 0;
  inset-x: 0;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.85));
  font-size: 10px;
  padding: 6px 8px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* EMPTY STATE & LOADING */
.loading-box {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--bg-dark);
  color: var(--text-sub);
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* TOAST NOTIFIKASI */
#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(50px);
  background: #1e293b;
  border: 1px solid var(--glass-border);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 600px) {
  .app-header, .app-footer { padding: 12px 14px; }
  .btn-tool span { display: none; }
  .nav-arrow { width: 44px; height: 44px; font-size: 16px; }
  .nav-prev { left: 10px; }
  .nav-next { right: 10px; }
  .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div class="loading-box" id="loadingBox">
  <div class="spinner"></div>
  <div style="font-size: 14px; font-weight: 600;">Memindai file WebP...</div>
</div>

<!-- BACKGROUND ANIMATION PLAYER -->
<div class="bg-player" id="bgPlayer"></div>
<div class="overlay-gradient"></div>

<!-- HEADER BAR -->
<header class="app-header">
  <div class="app-title">
    <i class="fa-solid fa-play"></i>
    <span>Galery Tika</span>
  </div>

  <div class="header-tools">
    <!-- TAMBAH / UPLOAD FILE WEBP -->
    <button class="btn-tool" onclick="document.getElementById('fileInput').click()" title="Tambah / Upload File WebP">
      <i class="fa-solid fa-folder-plus"></i>
      <span>Upload</span>
    </button>
    <input type="file" id="fileInput" accept="image/webp" multiple style="display: none;" onchange="handleFileUpload(event)">

    <!-- TAMPILAN MODE (COVER / CONTAIN) -->
    <button class="btn-tool btn-icon-only" id="btnFitMode" onclick="toggleFitMode()" title="Ubah Mode Tampilan (Ukuran Utuh / Penuh)">
      <i class="fa-solid fa-expand"></i>
    </button>

    <!-- SLIDESHOW AUTOMATIC ROTATION -->
    <button class="btn-tool btn-icon-only" id="btnAutoPlay" onclick="toggleAutoPlay()" title="Putar Otomatis (Slideshow)">
      <i class="fa-solid fa-rotate"></i>
    </button>

    <!-- GRID GALERI -->
    <button class="btn-tool" onclick="openGalleryModal()" title="Buka Daftar Galeri">
      <i class="fa-solid fa-border-all"></i>
      <span>Galeri</span>
    </button>
  </div>
</header>

<!-- NAVIGASI TOMBOL SAMPAING -->
<button class="nav-arrow nav-prev" onclick="prevWebp()" title="Animasi Sebelumnya">
  <i class="fa-solid fa-chevron-left"></i>
</button>

<button class="nav-arrow nav-next" onclick="nextWebp()" title="Animasi Selanjutnya">
  <i class="fa-solid fa-chevron-right"></i>
</button>

<!-- FOOTER BAR INFORMASI -->
<footer class="app-footer">
  <div class="info-box">
    <div class="file-name-text" id="fileNameText">Memuat...</div>
    <div class="counter-badge" id="counterText">0 / 0 WebP</div>
  </div>

  <div style="display: flex; gap: 8px;">
    <button class="btn-tool btn-icon-only" onclick="toggleFullscreen()" title="Layar Penuh">
      <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
    </button>
  </div>
</footer>

<!-- MODAL GALERI GRID -->
<div class="modal-gallery" id="galleryModal">
  <div class="gallery-header">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700;">
      <i class="fa-solid fa-images" style="color: var(--primary);"></i>
      <span>Koleksi WebP Galery Tika</span>
    </div>
    <button class="btn-tool btn-icon-only" onclick="closeGalleryModal()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="gallery-grid" id="galleryGridContainer">
    <!-- Grid Thumbnail diinjeksi via JS -->
  </div>
</div>

<!-- TOAST NOTIFIKASI -->
<div id="toast">Notifikasi</div>

<script>
/* ============================================================
   GLOBAL VARIABLES & STATE MANAGEMENT
============================================================ */
let webpList = [];             // Daftar URL / Path file WebP
let currentIndex = 0;          // Index file WebP yang aktif
let isFitContain = false;      // Mode ukuran gambar (Cover vs Contain)
let isAutoPlay = false;        // Status putar otomatis
let autoPlayTimer = null;      // Interval timer slideshow
let autoPlayIntervalMs = 5000; // Jeda putar otomatis (5 detik)

/* Touch / Swipe State */
let touchStartX = 0;
let touchStartY = 0;

/* ============================================================
   DETEKSI & PEMINDAIAN FILE WEBP DYNAMIC UNLIMITED
============================================================ */

// 1. Pindai folder server lokal/hosting secara otomatis
async function scanDirectoryForWebp() {
  const foundFiles = new Set();

  try {
    // Mencoba fetch root direktori untuk membaca listing file server (Apache/Nginx/LiveServer)
    const response = await fetch('./', { cache: 'no-cache' });
    if (response.ok) {
      const htmlText = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      const links = doc.querySelectorAll('a[href]');

      links.forEach(link => {
        const href = link.getAttribute('href');
        if (href && href.toLowerCase().endsWith('.webp')) {
          foundFiles.add(decodeURIComponent(href));
        }
      });
    }
  } catch (err) {
    console.log("Pindaian direktori otomatis terbatas oleh CORS/Server. Menggunakan mode probing.");
  }

  // 2. Jika tidak mendapatkan file via directory index, coba membaca file 'list.json' jika disiapkan
  if (foundFiles.size === 0) {
    try {
      const resJson = await fetch('list.json');
      if (resJson.ok) {
        const jsonList = await resJson.json();
        if (Array.isArray(jsonList)) {
          jsonList.forEach(f => {
            if (f.toLowerCase().endsWith('.webp')) foundFiles.add(f);
          });
        }
      }
    } catch(e) {}
  }

  // 3. Fallback Probing Luas (Memeriksa hingga puluhan format penamaan umum)
  if (foundFiles.size === 0) {
    const probeCandidates = [];
    
    // Probing angka standar: 1.webp s/d 150.webp
    for (let i = 1; i <= 150; i++) {
      probeCandidates.push(`${i}.webp`);
      probeCandidates.push(`bg${String(i).padStart(3, '0')}.webp`); // bg001.webp
      probeCandidates.push(`bg${i}.webp`);                         // bg1.webp
      probeCandidates.push(`anim${i}.webp`);                       // anim1.webp
      probeCandidates.push(`photo${i}.webp`);                      // photo1.webp
      probeCandidates.push(`tika${i}.webp`);                       // tika1.webp
    }

    const probePromise = (url) => new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(url);
      img.onerror = () => resolve(null);
      img.src = url;
    });

    // Jalankan tes paralel
    const batchResults = await Promise.all(probeCandidates.map(probePromise));
    batchResults.filter(Boolean).forEach(url => foundFiles.add(url));
  }

  return Array.from(foundFiles);
}

/* ============================================================
   INISIALISASI APLIKASI
============================================================ */
async function initApp() {
  showLoading(true);
  const detectedFiles = await scanDirectoryForWebp();

  if (detectedFiles.length > 0) {
    webpList = detectedFiles.map(file => ({
      name: extractFileName(file),
      url: file
    }));
  } else {
    // Jika tidak ada file terdeteksi di folder, tampilkan pesan petunjuk
    showToast("⚠️ Belum ada file .webp di folder. Silakan klik 'Upload'!");
  }

  showLoading(false);

  if (webpList.length > 0) {
    currentIndex = 0;
    updatePlayer();
  } else {
    document.getElementById('fileNameText').innerText = "Belum Ada File WebP";
    document.getElementById('counterText').innerText = "0 / 0 WebP";
  }
}

function extractFileName(pathOrUrl) {
  try {
    const clean = pathOrUrl.split('?')[0].split('#')[0];
    return clean.substring(clean.lastIndexOf('/') + 1);
  } catch (e) {
    return pathOrUrl;
  }
}

/* ============================================================
   KONTROL PEMUTAR & TAMPILAN
============================================================ */
function updatePlayer() {
  if (webpList.length === 0) return;

  const currentItem = webpList[currentIndex];
  const bgPlayer = document.getElementById('bgPlayer');
  
  // Tampilkan gambar WebP
  bgPlayer.style.backgroundImage = `url('${currentItem.url}')`;

  // Update Teks Informasi
  document.getElementById('fileNameText').innerText = currentItem.name;
  document.getElementById('counterText').innerText = `${currentIndex + 1} / ${webpList.length} WebP`;

  // Update status di galeri grid jika sedang terbuka
  updateActiveGridThumbnail();
}

function nextWebp() {
  if (webpList.length === 0) return;
  currentIndex = (currentIndex + 1) % webpList.length;
  updatePlayer();
}

function prevWebp() {
  if (webpList.length === 0) return;
  currentIndex = (currentIndex - 1 + webpList.length) % webpList.length;
  updatePlayer();
}

function selectWebp(index) {
  if (index >= 0 && index < webpList.length) {
    currentIndex = index;
    updatePlayer();
    closeGalleryModal();
  }
}

/* ============================================================
   KONTROL MODE UKURAN & SLIDESHOW OTOMATIS
============================================================ */
function toggleFitMode() {
  isFitContain = !isFitContain;
  const bgPlayer = document.getElementById('bgPlayer');
  const btn = document.getElementById('btnFitMode');

  if (isFitContain) {
    bgPlayer.classList.add('fit-contain');
    btn.style.color = 'var(--primary)';
    showToast('🖼️ Mode Gambar Utuh (Contain)');
  } else {
    bgPlayer.classList.remove('fit-contain');
    btn.style.color = 'var(--text-main)';
    showToast('📐 Mode Layar Penuh (Cover)');
  }
}

function toggleAutoPlay() {
  isAutoPlay = !isAutoPlay;
  const btn = document.getElementById('btnAutoPlay');

  if (isAutoPlay) {
    btn.style.color = 'var(--primary)';
    autoPlayTimer = setInterval(nextWebp, autoPlayIntervalMs);
    showToast('🔄 Putar Otomatis Aktif (5 detik)');
  } else {
    btn.style.color = 'var(--text-main)';
    clearInterval(autoPlayTimer);
    autoPlayTimer = null;
    showToast('⏸️ Putar Otomatis Dihentikan');
  }
}

/* ============================================================
   HANDLER UPLOAD LANGSUNG FILE WEBP
============================================================ */
function handleFileUpload(event) {
  const files = Array.from(event.target.files);
  if (!files || files.length === 0) return;

  let addedCount = 0;

  files.forEach(file => {
    if (file.type === 'image/webp' || file.name.toLowerCase().endsWith('.webp')) {
      const objectUrl = URL.createObjectURL(file);
      webpList.push({
        name: file.name,
        url: objectUrl
      });
      addedCount++;
    }
  });

  if (addedCount > 0) {
    showToast(`✅ ${addedCount} animasi WebP berhasil ditambahkan!`);
    if (webpList.length === addedCount) {
      currentIndex = 0;
    } else {
      currentIndex = webpList.length - addedCount; // Langsung tampilkan yang baru dimasukkan
    }
    updatePlayer();
  } else {
    showToast("⚠️ Mohon pilih file berformat .webp!");
  }

  event.target.value = '';
}

/* ============================================================
   MODAL GALERI GRID
============================================================ */
function openGalleryModal() {
  const modal = document.getElementById('galleryModal');
  const container = document.getElementById('galleryGridContainer');
  
  container.innerHTML = '';

  if (webpList.length === 0) {
    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px 0;">Belum ada file WebP yang dimuat.</div>`;
  } else {
    webpList.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = `thumb-card ${index === currentIndex ? 'active' : ''}`;
      card.onclick = () => selectWebp(index);

      const img = document.createElement('img');
      img.src = item.url;
      img.loading = 'lazy';
      img.alt = item.name;

      const title = document.createElement('div');
      title.className = 'thumb-title';
      title.innerText = item.name;

      card.appendChild(img);
      card.appendChild(title);
      container.appendChild(card);
    });
  }

  modal.classList.add('show');
}

function closeGalleryModal() {
  document.getElementById('galleryModal').classList.remove('show');
}

function updateActiveGridThumbnail() {
  const cards = document.querySelectorAll('.thumb-card');
  cards.forEach((card, idx) => {
    if (idx === currentIndex) {
      card.classList.add('active');
    } else {
      card.classList.remove('active');
    }
  });
}

/* ============================================================
   GESER / SWIPE TOUCH GESTURES (PADA HP/TABLET)
============================================================ */
document.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!e.changedTouches.length) return;

  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;

  const deltaX = touchEndX - touchStartX;
  const deltaY = touchEndY - touchStartY;

  // Pastikan gerakan lebih dominan secara horizontal daripada vertikal
  if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY)) {
    if (deltaX < 0) {
      nextWebp(); // Usap Kiri -> Selanjutnya
    } else {
      prevWebp(); // Usap Kanan -> Sebelumnya
    }
  }
}, { passive: true });

/* ============================================================
   NAVIGASI KEYBOARD (PANAH KIRI & KANAN)
============================================================ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextWebp();
  if (e.key === 'ArrowLeft') prevWebp();
  if (e.key === 'Space' || e.code === 'Space') {
    e.preventDefault();
    toggleAutoPlay();
  }
  if (e.key === 'Escape') closeGalleryModal();
});

/* ============================================================
   UTILITAS & HELPER
============================================================ */
function showLoading(show) {
  document.getElementById('loadingBox').style.display = show ? 'flex' : 'none';
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.innerText = msg;
  toast.classList.add('show');

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

// Jalankan aplikasi saat dokumen siap
document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
